<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reporte de Productos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f8f9fa;
        }
        h1 {
            color: #333333;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 650px;
            background-color: #ffffff;
            border: 1px solid #dee2e6;
        }
        th, td {
            border: 1px solid #dee2e6;
            padding: 10px 14px;
            text-align: left;
        }
        th {
            background-color: #007bff;
            color: #ffffff;
        }
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <h1>Reporte de Productos</h1>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Precio</th>
            </tr>
        </thead>
        <tbody>
            <tr><td>0</td><td>tv</td><td>$100</td></tr>
            <tr><td>1</td><td>pc</td><td>$500</td></tr>
            <tr><td>3</td><td>notebook</td><td>$599</td></tr>
            <tr><td>4</td><td>tablet</td><td>$299</td></tr>
        </tbody>
    </table>
</body>
</html>
